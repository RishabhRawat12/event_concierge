services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: always

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - server/.env
    environment:
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./server:/app
    depends_on:
      - redis

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    env_file:
      - client/.env
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./client:/app
    depends_on:
      - server
