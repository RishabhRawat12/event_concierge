<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Concierge Assessment Platform</title>
    <style>
        :root { --primary: #6366f1; --bg: #0f172a; --card: rgba(30, 41, 59, 0.7); --text: #f8fafc; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        main { 
            width: 420px; padding: 2.5rem; background: var(--card); backdrop-filter: blur(12px); 
            border-right: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; gap: 2rem;
            z-index: 10; scrollbar-width: none; overflow-y: auto;
        }
        
        #map-container { flex-grow: 1; height: 100%; background: #1e293b; }
        
        h1, h2 { font-weight: 800; letter-spacing: -0.025em; margin: 0; }
        h1 { font-size: 1.875rem; color: #fff; }
        h2 { font-size: 1.25rem; color: var(--primary); }

        label { display: block; margin-bottom: 0.5rem; font-size: 0.875rem; font-weight: 600; color: #94a3b8; }
        input[type="text"] { 
            width: 100%; padding: 0.875rem; background: rgba(15, 23, 42, 0.6); border: 1px solid #334155; 
            border-radius: 12px; color: #fff; transition: all 0.2s; font-size: 1rem;
        }
        input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2); }
        
        button { 
            background: var(--primary); color: #fff; padding: 0.875rem 1.5rem; border: none; 
            border-radius: 12px; cursor: pointer; font-weight: 700; transition: transform 0.2s, background 0.2s;
            width: 100%;
        }
        button:hover { background: #4f46e5; transform: translateY(-1px); }
        button:active { transform: translateY(0); }

        .status-card { background: rgba(255,255,255,0.03); border-radius: 16px; padding: 1.5rem; border: 1px solid rgba(255,255,255,0.05); }
        .itinerary-item { border-left: 3px solid var(--primary); padding-left: 1.25rem; margin-top: 1.5rem; animation: slideIn 0.4s ease-out; }
        
        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
        
        .alert-box { 
            background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); 
            padding: 1.25rem; border-radius: 12px; font-size: 0.875rem; color: #fca5a5;
            line-height: 1.5;
        }
        .staff-btn { background: #ef4444; margin-top: 1rem; }
        .staff-btn:hover { background: #dc2626; }
    </style>
</head>
<body>
    <main role="main">
        <header>
            <h1>Event Concierge</h1>
            <p style="color: #94a3b8; font-size: 0.875rem; margin-top: 0.5rem;">Elite AI Orchestation Platform</p>
        </header>

        <section aria-labelledby="preferences-title">
            <h2 id="preferences-title">Preferences</h2>
            <form id="preferences-form" style="margin-top: 1.5rem;">
                <label for="event-preferences">Sectors of Interest</label>
                <input type="text" id="event-preferences" required placeholder="AI, Crypto, Fintech...">
                <button type="submit" style="margin-top: 1rem;">Generate Real-time Itinerary</button>
            </form>
            <div id="status-feed" style="margin-top: 1.5rem;"></div>
        </section>

        <section id="staff-ui" aria-label="Command Center">
            <h2>Command Center</h2>
            <div id="mock-crowd-alert" class="alert-box" style="margin-top: 1rem;">
                Monitoring WebSocket stream...
            </div>
            <button type="button" class="staff-btn" id="trigger-staff-btn">Initiate Emergency Protocol</button>
        </section>
    </main>

    <div id="map-container" aria-label="Geospatial Intelligence Map"></div>

    <script>
        let map;

        async function initApp() {
            try {
                const configRes = await fetch('/api/config/maps');
                const config = await configRes.json();
                
                const script = document.createElement('script');
                // Added libraries=marker and async/defer properly
                script.src = `https://maps.googleapis.com/maps/api/js?key=${config.maps_key}&callback=initMap&libraries=marker&v=weekly`;
                script.async = true;
                script.defer = true;
                
                window.initMap = async () => {
                    const { Map } = await google.maps.importLibrary("maps");
                    const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

                    map = new Map(document.getElementById("map-container"), {
                        center: { lat: 37.784, lng: -122.401 },
                        zoom: 15,
                        mapId: "DEMO_MAP_ID", // Required for AdvancedMarkerElement
                        mapId: "4504f8b37365c3d0", // Optional: Example Map ID for dark theme
                        styles: [ // Fallback dark theme styles
                            { elementType: "geometry", stylers: [{ color: "#242f3e" }] },
                            { elementType: "labels.text.stroke", stylers: [{ color: "#242f3e" }] },
                            { elementType: "labels.text.fill", stylers: [{ color: "#746855" }] },
                        ]
                    });

                    config.events.forEach(evt => {
                        new AdvancedMarkerElement({
                            map,
                            position: { lat: evt.latitude, lng: evt.longitude },
                            title: evt.name,
                        });
                    });
                };
                document.head.appendChild(script);
            } catch (err) {
                console.error("Critical: Initialization error", err);
            }
            
            // Connect WebSocket
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const ws = new WebSocket(`${protocol}//${window.location.host}/ws`);
            ws.onmessage = (event) => {
                const alertData = JSON.parse(event.data);
                const statusBox = document.getElementById('mock-crowd-alert');
                statusBox.innerHTML = `
                    <strong style="color:#d32f2f">CRITICAL: [${alertData.zone_id}] - ${alertData.alert_type}</strong><br/>
                    <strong style="color:green">AI Resolution Protocol:</strong> ${alertData.protocol}
                `;
            };
        }
        
        initApp();

        document.getElementById('preferences-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const topicsInput = document.getElementById('event-preferences').value;
            const topics = topicsInput.split(',').map(t => t.trim()).filter(t => t);
            
            const payload = {
                user_location: { latitude: 37.784261, longitude: -122.401344 },
                start_time: "09:00 AM",
                end_time: "05:00 PM",
                preferred_topics: topics.length > 0 ? topics : ["AI"]
            };

            const statusFeed = document.getElementById('status-feed');
            statusFeed.innerHTML = "<p><em>Generating optimal itinerary...</em></p>";

            try {
                const response = await fetch('/api/itinerary', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error(`API ${response.status}`);
                const data = await response.json();
                
                let html = `<h3>Weather Context: ${data.current_weather || 'Unknown'}</h3>`;
                data.itinerary.forEach(evt => {
                    html += `
                        <div style="margin-top: 1rem; margin-bottom: 1rem; border-left: 4px solid #005fcc; padding-left: 1rem;">
                            <strong>${evt.event_name}</strong><br/>
                            <small>${evt.start_time} - ${evt.end_time} (${evt.transition_time_seconds}s walk)</small><br/>
                            <em>${evt.walking_directions}</em>
                        </div>
                    `;
                });
                statusFeed.innerHTML = html;
            } catch (err) {
                statusFeed.innerHTML = `<p style="color:red"><strong>Failed:</strong> ${err.message}</p>`;
            }
        });

        document.getElementById('trigger-staff-btn').addEventListener('click', async () => {
            const statusBox = document.getElementById('mock-crowd-alert');
            statusBox.innerHTML = "<em>Sending secure alert via token auth...</em>";
            try {
                const response = await fetch('/api/staff/zone-action', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer SUPER_SECRET_STAFF_TOKEN'
                    },
                    body: JSON.stringify({ zone_id: "Main Gate", alert_type: "Access Control Bottleneck" })
                });
                
                if (!response.ok) throw new Error(`Staff Server Error: ${response.status}`);
                // UI updates naturally via the WebSocket Broadcast payload!
            } catch (err) {
                statusBox.innerHTML = `<strong style="color:red">Failed Auth / Push:</strong> ${err.message}`;
            }
        });
    </script>
</body>
</html>
