<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Concierge - Agentic AI Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            padding: 2.5rem 1rem;
            text-align: center;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        h1 { 
            margin: 0; 
            font-size: 2.5rem; 
            font-weight: 800; 
            background: linear-gradient(to right, #818cf8, #c084fc); 
            -webkit-background-clip: text; 
            background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }
        header p { color: var(--text-muted); margin-top: 0.5rem; font-size: 1.1rem; }

        .container {
            max-width: 1600px;
            width: 95%;
            margin: 0 auto;
            padding: 2rem;
            display: grid;
            grid-template-columns: minmax(350px, 450px) 1fr;
            gap: 2rem;
            flex-grow: 1;
        }

        .card {
            background: var(--card);
            border-radius: 1.25rem;
            padding: 2rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255,255,255,0.05);
            height: fit-content;
        }

        h2 { font-size: 1.35rem; margin-top: 0; margin-bottom: 1.25rem; border-left: 4px solid var(--primary); padding-left: 0.75rem; }

        .form-group { margin-bottom: 1.25rem; }
        label { display: block; margin-bottom: 0.4rem; font-weight: 600; color: var(--text-muted); font-size: 0.9rem; }

        input, select, button {
            width: 100%;
            padding: 0.8rem;
            border-radius: 0.75rem;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.2s;
        }

        button {
            background: var(--primary);
            border: none;
            cursor: pointer;
            font-weight: 600;
            margin-top: 1rem;
        }

        button:hover { background: var(--primary-dark); transform: translateY(-1px); }

        #map {
            height: 750px;
            width: 100%;
            border-radius: 1.25rem;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .itinerary-item {
            border-left: 3px solid var(--primary);
            padding: 1rem;
            margin-bottom: 1rem;
            background: rgba(255,255,255,0.02);
            border-radius: 0.5rem;
        }

        .alert-box {
            background: rgba(239, 68, 68, 0.05);
            border: 1px solid rgba(239, 68, 68, 0.15);
            padding: 1rem;
            border-radius: 0.75rem;
            margin-top: 1rem;
            font-size: 0.9rem;
        }

        .live-insight-item {
            display: flex; 
            justify-content: space-between; 
            padding: 0.5rem 0; 
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        @media (max-width: 1024px) {
            .container { grid-template-columns: 1fr; }
            #map { height: 500px; }
        }
    </style>
</head>
<body>
    <header>
        <h1>Event Concierge</h1>
        <p>Agentic Orchestration & Real-time Venue Insights</p>
    </header>

    <main class="container">
        <aside class="sidebar" style="display: flex; flex-direction: column; gap: 1.5rem;">
            <section class="card">
                <h2>Generate Optimized Plan</h2>
                <form id="itineraryForm">
                    <div class="form-group">
                        <label>Time Window</label>
                        <div style="display: flex; gap: 0.5rem;">
                            <input type="text" id="startTime" value="09:00 AM">
                            <input type="text" id="endTime" value="05:00 PM">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Interests (Ctrl+Click)</label>
                        <select id="interests" multiple size="3">
                            <option value="AI" selected>AI & ML</option>
                            <option value="Cloud">Cloud Systems</option>
                            <option value="Security">Cyber Security</option>
                        </select>
                    </div>
                    <button type="submit" id="submitBtn">Compute Itinerary</button>
                </form>
            </section>

            <section id="itinerarySection" class="card" style="display: none;">
                <h2>Optimized Schedule</h2>
                <div id="weatherInfo"></div>
                <div id="itineraryContent"></div>
            </section>

            <section class="card">
                <h2>Command Center</h2>
                <div id="live-feed" style="max-height: 150px; overflow-y: auto; font-size: 0.85rem; color: var(--text-muted);">
                    <p>Scanning sensor network...</p>
                </div>
                <div id="staffAlert" class="alert-box">
                    Awaiting operational priorities...
                </div>
                <div class="form-group" style="margin-top: 1rem;">
                    <input type="password" id="staffToken" placeholder="Auth Token (Emergency Only)">
                </div>
                <button type="button" style="background: var(--danger);" id="trigger-staff-btn">Initiate Tactical Protocol</button>
                <a href="https://lookerstudio.google.com/" target="_blank" style="display: block; margin-top: 1rem; color: var(--primary); text-decoration: none; font-size: 0.8rem; text-align: center;">↗ Enterprise Analytics Dashboard</a>
            </section>
        </aside>

        <section class="map-view">
            <div class="card">
                <h2>Visual Digital Twin</h2>
                <div id="map"></div>
            </div>
        </section>
    </main>

    <script id="events-data" type="application/json">{{ events | tojson | safe }}</script>
    <script>
        let map;
        const eventData = JSON.parse(document.getElementById('events-data').textContent);
        
        async function initMap() {
            try {
                const { Map, InfoWindow } = await google.maps.importLibrary("maps");
                const { AdvancedMarkerElement, PinElement } = await google.maps.importLibrary("marker");

                map = new Map(document.getElementById("map"), {
                    center: { lat: 37.784, lng: -122.401 },
                    zoom: 16,
                    mapId: "DEMO_MAP_ID",
                    styles: [
                        { "featureType": "all", "elementType": "geometry", "stylers": [{"color": "#1e293b"}] },
                        { "featureType": "all", "elementType": "labels.text.fill", "stylers": [{"color": "#94a3b8"}] }
                    ]
                });

                // Add Zone Polygon
                new google.maps.Polygon({
                    paths: [
                        { lat: 37.784261, lng: -122.401344 },
                        { lat: 37.785261, lng: -122.401344 },
                        { lat: 37.785261, lng: -122.400344 },
                        { lat: 37.784261, lng: -122.400344 }
                    ],
                    strokeColor: "#6366f1",
                    strokeOpacity: 0.8,
                    strokeWeight: 2,
                    fillColor: "#6366f1",
                    fillOpacity: 0.1,
                    map: map
                });

                const infoWindow = new InfoWindow();
                eventData.forEach(event => {
                    const marker = new AdvancedMarkerElement({
                        position: { lat: event.latitude, lng: event.longitude },
                        map: map,
                        title: event.name
                    });
                    marker.addListener("click", () => {
                        infoWindow.setContent(`<div style="color: #334155;"><strong>${event.name}</strong><br>${event.topic}</div>`);
                        infoWindow.open(marker.map, marker);
                    });
                });
            } catch (err) { console.error(err); }
        }

        const ws = new WebSocket(`${window.location.protocol === 'https:' ? 'wss:' : 'ws:'}//${window.location.host}/ws`);
        ws.onmessage = (e) => {
            const data = JSON.parse(e.data);
            if (data.alert_type) {
                const box = document.getElementById('staffAlert');
                box.style.background = 'rgba(239, 68, 68, 0.1)';
                box.style.color = '#fca5a5';
                box.innerHTML = `<strong>🚨 ${data.zone_id} ALERT</strong><br>${data.protocol}`;
            } else {
                const feed = document.getElementById('live-feed');
                feed.innerHTML = `<div class="live-insight-item"><span>${data.zone}</span><span style="color: ${data.level > 80 ? 'var(--danger)' : 'var(--success)'}">${data.level}%</span></div>` + feed.innerHTML;
            }
        };

        document.getElementById('itineraryForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true; btn.textContent = 'Computing Optimal Path...';

            try {
                const res = await fetch('/api/itinerary', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_location: { latitude: 37.7749, longitude: -122.4194 },
                        start_time: document.getElementById('startTime').value,
                        end_time: document.getElementById('endTime').value,
                        preferred_topics: Array.from(document.getElementById('interests').selectedOptions).map(o => o.value)
                    })
                });
                const data = await res.json();
                const container = document.getElementById('itineraryContent');
                container.innerHTML = '';
                data.itinerary.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'itinerary-item';
                    div.innerHTML = `<h3>${item.event_name}</h3><p>${item.start_time} - ${item.end_time}</p><p style="font-size: 0.85rem; opacity: 0.8;">${item.walking_directions}</p>`;
                    container.appendChild(div);
                });
                document.getElementById('itinerarySection').style.display = 'block';
            } catch (err) { alert(err.message); }
            finally { btn.disabled = false; btn.textContent = 'Compute Itinerary'; }
        });

        document.getElementById('trigger-staff-btn').addEventListener('click', async () => {
            const token = document.getElementById('staffToken').value;
            if (!token) return alert('Token required');
            await fetch('/api/staff/zone-action', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify({ zone_id: "Main Entrance", alert_type: "Emergency" })
            });
        });
    </script>
    <script async src="https://maps.googleapis.com/maps/api/js?key={{ maps_key }}&callback=initMap"></script>
</body>
</html>
